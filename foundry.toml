[profile.default]
src = "src"
out = "out"
libs = ["../lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 10_000
via_ir = true
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false
build_info = true
extra_output = ["metadata", "storageLayout"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"
